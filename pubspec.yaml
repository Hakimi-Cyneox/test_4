name: yayasan_app
description: A new Flutter project.
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter


  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.2

  # GetX STATE MANAGEMENT
  get: ^4.6.5
  get_storage: ^2.0.3

  url_launcher: ^6.3.2
  package_info_plus: ^8.3.0
  intl: ^0.18.1
  device_info_plus: ^11.1.1
  provider: ^6.0.4
  sizer: ^2.0.15
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.2.16
  flutter_staggered_grid_view: ^0.6.2
  cached_network_image: ^3.2.1
  flutter_spinkit: ^5.1.0
  carousel_slider: ^5.0.0
  smooth_page_indicator: ^1.0.0+2
  animated_toggle_switch: ^0.6.1
  pin_code_fields: ^8.0.1
  flutter_multi_formatter: ^2.10.2
  email_validator: ^2.1.17
  stop_watch_timer: ^2.0.0
  country_icons: ^2.0.2
  flutter_keyboard_visibility: ^5.4.0
  connectivity_plus: ^6.1.3
  shimmer: ^3.0.0
  flutter_inappwebview: ^6.1.0
  calendar_date_picker2: ^0.5.1
  grouped_list: ^5.1.2
  auto_size_text: ^3.0.0
  image_picker: 1.0.8
  dotted_border: ^2.0.0+3
  permission_handler: 12.0.1
  mime: ^1.0.4
  http: 1.0.0
  flutter_html: ^3.0.0-alpha.6
  easy_rich_text: ^1.2.0
  percent_indicator: ^4.0.1
  collection: ^1.17.1
  version: ^3.0.2
  decimal: ^2.3.2
  marquee: ^2.2.3
  table_calendar: ^3.0.9
  flutter_slidable: ^4.0.3
  fl_chart: ^0.69.0
  store_redirect: ^2.0.4
  simple_numpad: ^1.0.5
  dotted_line: ^3.2.3
  slide_to_submit_button: ^1.0.3
  flutter_downloader: ^1.11.6
  open_file: ^3.3.2
  downloadsfolder: ^1.2.0
  easy_pdf_viewer: ^1.0.8
  pdf: ^3.11.3
  path_provider: ^2.1.5
  super_tooltip: ^2.1.0
  photo_view: ^0.15.0
  share_plus: ^12.0.1
  flutter_decorated_text: ^1.0.14

dependency_overrides:
  fading_edge_scrollview: ^4.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^2.0.0
  build_runner:
  flutter_gen_runner:

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon_v3_2.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icons/app_icon_v3_5.png"

flutter_native_splash:
  # This package generates native code to customize Flutter's default white native splash screen
  # with background color and splash image.
  # Customize the parameters below, and run the following command in the terminal:
  # flutter pub run flutter_native_splash:create
  # To restore Flutter's default white splash screen, run the following command in the terminal:
  # flutter pub run flutter_native_splash:remove

  # color or background_image is the only required parameter.  Use color to set the background
  # of your splash screen to a solid color.  Use background_image to set the background of your
  # splash screen to a png image.  This is useful for gradients. The image will be stretch to the
  # size of the app. Only one parameter can be used, color and background_image cannot both be set.
  #  color: "#FFFFFF"
  background_image: "assets/images/splash_screen_new_v3.jpeg"

  # Optional parameters are listed below.  To enable a parameter, uncomment the line by removing
  # the leading # character.

  # The image parameter allows you to specify an image used in the splash screen.  It must be a
  # png file and should be sized for 4x pixel density.
  # image: "assets/icons/splash_icon_v3.png"

  # The branding property allows you to specify an image used as branding in the splash screen.
  # It must be a png file. It is supported for Android, iOS and the Web.  For Android 12,
  # see the Android 12 section below.

  # To position the branding image at the bottom of the screen you can use bottom, bottomRight,
  # and bottomLeft. The default values is bottom if not specified or specified something else.


  # The color_dark, background_image_dark, image_dark, branding_dark are parameters that set the background
  # and image when the device is in dark mode. If they are not specified, the app will use the
  # parameters from above. If the image_dark parameter is specified, color_dark or
  # background_image_dark must be specified.  color_dark and background_image_dark cannot both be
  # set.
  #  color_dark: "#FFFFFF"
  background_image_dark: "assets/images/splash_screen_new_v3.jpeg"
  # image_dark: "assets/icons/splash_icon_v3.png"

  # Android 12 handles the splash screen differently than previous versions.  Please visit
  # https://developer.android.com/guide/topics/ui/splash-screen
  # Following are Android 12 specific parameter.
  android_12:
    # The image parameter sets the splash screen icon image.  If this parameter is not specified,
    # the app's launcher icon will be used instead.
    # Please note that the splash screen will be clipped to a circle on the center of the screen.
    # App icon with an icon background: This should be 960×960 pixels, and fit within a circle
    # 640 pixels in diameter.
    # App icon without an icon background: This should be 1152×1152 pixels, and fit within a circle
    # 768 pixels in diameter.
    image: "assets/icons/android_splash_v3_3.png"

    # Splash screen background color.
    color: "#F2F3F3"

    # App icon background color.
    icon_background_color: "#F2F3F3"

    # The branding property allows you to specify an image used as branding in the splash screen.
    # branding: assets/icons/branding_icon.png

    # The image_dark, color_dark, icon_background_color_dark, and branding_dark set values that
    # apply when the device is in dark mode. If they are not specified, the app will use the
    # parameters from above.
    #image_dark: assets/android12splash-invert.png
    color_dark: "#F2F3F3"
  #icon_background_color_dark: "#eeeeee"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/
    - assets/icons/
    - assets/icons/dashboard/
    - assets/icons/entry/
    - assets/images/
    - assets/gif/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: Inter Regular
      fonts:
        - asset: assets/fonts/Inter_18pt-Regular.ttf
    - family: Inter Medium
      fonts:
        - asset: assets/fonts/Inter_18pt-Medium.ttf
    - family: Inter SemiBold
      fonts:
        - asset: assets/fonts/Inter_18pt-SemiBold.ttf
    - family: Inter Bold
      fonts:
        - asset: assets/fonts/Inter_18pt-Bold.ttf
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
